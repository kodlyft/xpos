name: Tests

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.po"
      - "**.pot"
      - "docs/**"
  push:
    branches:
      - develop
      - main
  schedule:
    # Run everyday at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: "Frappe / ERPNext branch"
        default: "version-16"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tests-xpos-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=10

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Clone xpos
        uses: actions/checkout@v7
        with:
          path: xpos

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check for merge conflicts and syntax errors
        run: |
          python -m compileall -q -f "${GITHUB_WORKSPACE}/xpos/xpos"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}/xpos"; then
            echo "::error::Found merge conflict markers"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmariadb-dev mariadb-client wkhtmltopdf

      - name: Add test_site to hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Configure MariaDB
        run: |
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e \
            "SET GLOBAL character_set_server = 'utf8mb4';
             SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Install bench and set up site
        env:
          FRAPPE_BRANCH: ${{ inputs.frappe_branch || 'version-16' }}
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" \
            --frappe-branch "${FRAPPE_BRANCH}" ~/frappe-bench
          cd ~/frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"
          bench get-app --branch "${FRAPPE_BRANCH}" erpnext
          bench get-app xpos "${GITHUB_WORKSPACE}/xpos"
          bench new-site test_site \
            --db-root-username root \
            --db-root-password root \
            --db-host 127.0.0.1 \
            --admin-password admin \
            --install-app erpnext \
            --install-app xpos
          bench --site test_site set-config allow_tests true

      - name: Run tests
        run: cd ~/frappe-bench && bench --site test_site run-tests --app xpos

      - name: Show bench logs
        if: ${{ always() }}
        run: |
          cd ~/frappe-bench/logs 2>/dev/null || exit 0
          for f in ./*.log*; do
            echo "Printing log: $f"
            cat "$f"
          done
