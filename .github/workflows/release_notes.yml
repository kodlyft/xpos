# This action:
#
# 1. Generates release notes using github API (grouped by .github/release.yml categories).
# 2. Strips unnecessary info like chore/style etc from notes.
# 3. Updates release info.
#
# Called from release.yml after semantic-release publishes a tag; can also be run by hand.

name: "Release Notes"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag of release like v2.10.0"
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

permissions:
  contents: write

jobs:
  regen-notes:
    name: "Regenerate release notes"
    runs-on: ubuntu-latest

    steps:
      - name: Update notes
        run: |
          NEW_NOTES=$(gh api --method POST -H "Accept: application/vnd.github+json" /repos/$REPO/releases/generate-notes -f tag_name=$RELEASE_TAG \
            | jq -r '.body' \
            | sed -E '/^\* (chore|ci|test|docs|style|build)/d' \
            | sed -E 's/by @mergify //'
          )
          RELEASE_ID=$(gh api -H "Accept: application/vnd.github+json" /repos/$REPO/releases/tags/$RELEASE_TAG | jq -r '.id')
          gh api --method PATCH -H "Accept: application/vnd.github+json" /repos/$REPO/releases/$RELEASE_ID -f body="$NEW_NOTES"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag_name }}
